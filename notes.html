<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学習メモ">
<link rel="manifest" href="notes.webmanifest">
<link rel="apple-touch-icon" href="notes-icon.png">
<title>学習メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 色の役割（学習アプリと共通。1色につき1つの意味）
     paper=背景 / sheet=触る面（入力欄・キー） / ink=文字と主ボタン / ink-2=補足 / rule=罫線
     科目の色=科目を見分ける小さな四角だけ / danger=削除だけ
     選んでいる状態は色ではなく、下線・左線と太字で表す */
  :root {
    --paper: #f5f3ee; --sheet: #ffffff; --ink: #1d1c1a; --ink-2: #67635b; --rule: #d9d4c8; --danger: #b3261e;
    --font: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #161614; --sheet: #1f1f1c; --ink: #ecebe6; --ink-2: #a29d93; --rule: #383631; --danger: #ef6b5e; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; } /* display:flex 等の指定より hidden を優先する */
  body {
    margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.65 var(--font);
    padding: env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom));
  }
  body.typing { padding-bottom: 16px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 10px 16px 24px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-2); }
  .swatch { display: inline-block; width: 9px; height: 9px; background: var(--c); flex: none; align-self: flex-start; margin-top: .55em; }
  .clamp2 { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp1 { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 0 10px; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
  header.top h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .syncbadge { font-size: 12px; color: var(--ink-2); }

  /* ボタン：主ボタン(墨)／ふつう(枠)／文字だけ */
  button { font: 500 14px/1.3 var(--font); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 10px 14px; cursor: pointer; }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
  button.textbtn { background: none; border: none; padding: 6px 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
  button.danger { color: var(--danger); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  input, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 9px 10px; min-width: 0; }
  input:focus, select:focus { outline: none; border-color: var(--ink); }

  /* 今日の動画（学習→復習）：選んでいる行は左線と太字 */
  .today { margin: 0; padding: 0; list-style: none; border-bottom: 1px solid var(--rule); }
  .today button { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 8px; width: 100%; text-align: left; background: none; border: none; border-left: 3px solid transparent; border-radius: 0; padding: 10px 0 10px 10px; }
  .today li + li button { border-top: 1px solid var(--rule); }
  .today button.on { border-left-color: var(--ink); }
  .today button.on .sub { font-weight: 700; }
  .today .role { grid-row: span 2; font-size: 12px; color: var(--ink-2); padding-top: 2px; }
  .today .sub { display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  .today .no { font-size: 13px; color: var(--ink-2); }
  .today .t { grid-column: 2 / 4; font-size: 12px; color: var(--ink-2); }
  .today button:disabled { opacity: .55; }

  /* ほかの動画を選ぶ */
  .picker { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  .picker label { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .picker select { flex: 1; font-size: 15px; }
  .stepper { display: flex; align-items: center; gap: 4px; flex: none; }
  .stepper button { width: 38px; padding: 8px 0; }
  .stepper .num { min-width: 52px; text-align: center; font-size: 14px; }

  /* 主役：いま書いている動画と入力欄（スクロールしても上に残す） */
  .sticky { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 10px 0 12px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
  .curvideo { display: flex; align-items: baseline; gap: 6px; font-size: 13px; margin-bottom: 10px; min-width: 0; }
  .curvideo b { white-space: nowrap; }
  .curvideo .clamp1 { color: var(--ink-2); min-width: 0; }
  .kinds { display: flex; border-bottom: 1px solid var(--rule); margin-bottom: 10px; }
  .kinds button { flex: 1; background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; margin-bottom: -1px; padding: 8px 0; color: var(--ink-2); }
  .kinds button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }
  .mods { display: flex; gap: 6px; margin-bottom: 8px; }
  .mods button { flex: 1; padding: 7px 0; font: 500 17px/1.2 var(--mono); }
  .inrow { display: flex; gap: 6px; }
  .inrow input { flex: 1; }
  .inrow input.keys { flex: 0 0 30%; font-family: var(--mono); }
  .inrow button { flex: none; }

  /* メモ一覧：罫線で区切った行 */
  .group + .group { border-top: 3px solid var(--rule); }
  .entry { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 10px 0; font-weight: 400; font-size: 15px; }
  .entry > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  kbd, .kbd { font: 500 13px/1.4 var(--mono); background: var(--sheet); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
  .empty { color: var(--ink-2); font-size: 14px; padding: 28px 0; }

  /* 見返す */
  .filters { display: flex; gap: 8px; padding: 10px 0; }
  .filters input { flex: 1; }
  .filters select { flex: 0 0 38%; }
  .vgroup { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 12px 0; font-weight: 400; }
  .vgroup .head { display: flex; align-items: baseline; gap: 6px; font-size: 13px; margin-bottom: 4px; min-width: 0; }
  .vgroup .head .clamp1 { color: var(--ink-2); min-width: 0; }
  .vgroup .line { font-size: 14px; padding: 1px 0; overflow-wrap: anywhere; }
  .vgroup .line .n { font-family: var(--mono); color: var(--ink-2); margin-right: 4px; }
  .vgroup .line kbd { margin-right: 6px; }
  mark { background: none; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

  /* クイズ */
  .quiz { padding: 28px 0 16px; text-align: center; }
  .quiz .meta { display: flex; justify-content: center; align-items: baseline; gap: 6px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
  .quiz .q { font-size: 22px; font-weight: 700; margin: 18px 0 22px; overflow-wrap: anywhere; }
  .quiz .a { margin-bottom: 24px; }
  .quiz .a kbd { font-size: 30px; padding: 4px 14px; }
  .quiz .btns { display: flex; gap: 8px; }
  .quiz .btns button { flex: 1; padding: 14px; }

  /* 下のタブ（文字だけ。今いるタブは上線と太字） */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--paper); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; background: none; border: none; border-top: 2px solid transparent; border-radius: 0; margin-top: -1px; padding: 14px 0 12px; color: var(--ink-2); font-size: 13px; }
  .tabbar button.on { color: var(--ink); border-top-color: var(--ink); font-weight: 700; }
  body.typing .tabbar { display: none; }

  /* 編集ダイアログ */
  dialog { width: min(92vw, 480px); background: var(--paper); color: var(--ink); border: 1px solid var(--ink); border-radius: 4px; padding: 16px; }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog .f { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  dialog .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  dialog .bar .grow { flex: 1; }

  /* 設定 */
  .settings .field { padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .settings .field > label { display: block; font-weight: 700; margin-bottom: 8px; }
  .settings ol { padding-left: 20px; font-size: 14px; margin: 4px 0 8px; }
  .note { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
  .row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row2 input { flex: 1 1 180px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>学習メモ</h1>
    <span class="syncbadge" id="syncBadge"></span>
  </header>

  <!-- 記録 -->
  <section id="tab-record">
    <ul class="today" id="todayCards"></ul>
    <div class="picker" id="picker">
      <label for="pickSubject">ほかの動画</label>
      <select id="pickSubject"></select>
      <div class="stepper">
        <button data-step="-1" aria-label="1本前">−</button>
        <span class="num" id="pickNo"></span>
        <button data-step="1" aria-label="1本後">＋</button>
      </div>
    </div>
    <div class="sticky">
      <div class="curvideo" id="curVideo"></div>
      <div class="kinds" id="kinds" role="tablist">
        <button data-kind="shortcut">キー操作</button>
        <button data-kind="step">手順</button>
        <button data-kind="value">設定値</button>
      </div>
      <div id="rowShortcut">
        <div class="mods" id="mods">
          <button data-mod="⌘" aria-label="command">⌘</button><button data-mod="⌥" aria-label="option">⌥</button>
          <button data-mod="⇧" aria-label="shift">⇧</button><button data-mod="⌃" aria-label="control">⌃</button>
          <button data-mod="BS" aria-label="1文字消す">⌫</button>
        </div>
        <div class="inrow">
          <input id="inKeys" class="keys" placeholder="例 ⌘J" enterkeyhint="next" autocomplete="off" autocapitalize="characters">
          <input id="inDesc" placeholder="何をする操作か" enterkeyhint="enter" autocomplete="off">
          <button class="primary" data-add>追加</button>
        </div>
      </div>
      <div id="rowText" class="inrow">
        <input id="inText" enterkeyhint="enter" autocomplete="off">
        <button class="primary" data-add>追加</button>
      </div>
    </div>
    <div id="entries"></div>
  </section>

  <!-- 見返す -->
  <section id="tab-review" hidden>
    <div class="filters">
      <input type="search" id="searchInput" placeholder="キーワードで探す">
      <select id="reviewFilter" aria-label="科目で絞り込む"></select>
    </div>
    <div id="reviewList"></div>
  </section>

  <!-- クイズ -->
  <section id="tab-quiz" hidden>
    <div class="filters"><select id="quizFilter" aria-label="科目で絞り込む" style="flex:1"></select></div>
    <div id="quizBox"></div>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" class="settings" hidden>
    <div class="field">
      <label>学習アプリとの連携</label>
      <div id="syncInfo" class="note" style="margin-bottom:10px;"></div>
      <div class="row2">
        <input id="codeInput" placeholder="連携コード（16文字）" autocapitalize="characters" autocomplete="off">
        <button id="codeSaveBtn">コードを保存</button>
      </div>
      <div class="row2" style="margin-top:8px; gap:20px;">
        <button id="pullBtn">今日の動画を受け取り直す</button>
        <button id="unlinkBtn" class="textbtn">連携を解除</button>
      </div>
      <p class="note">コードはPCの学習アプリの「設定 → スマホの学習メモと連携」にあります。QRを読めば自動で入ります。</p>
    </div>
    <div class="field">
      <label>ホーム画面に追加する</label>
      <ol>
        <li>iPhone（Safari）：共有ボタン →「ホーム画面に追加」</li>
        <li>Android（Chrome）：右上の︙ →「ホーム画面に追加」</li>
      </ol>
      <p class="note">iPhoneでは、Safariで開いたときとホーム画面のアイコンから開いたときで保存場所が別になります。追加したあとは、いつもアイコンから開いてください。アイコン側で「未連携」なら、上の欄にコードを入れてください。</p>
    </div>
    <div class="field">
      <label>バックアップ</label>
      <div class="row2">
        <button id="exportBtn">メモを書き出す</button>
        <button id="importBtn">書き出したファイルを読み込む</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <p class="note" id="countInfo"></p>
    </div>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="record" class="on">記録</button>
  <button data-tab="review">見返す</button>
  <button data-tab="quiz">クイズ</button>
  <button data-tab="settings">設定</button>
</nav>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <div class="f">
      <div class="note" id="editKind"></div>
      <input id="editKeys" placeholder="キー（例 ⌘J）" autocomplete="off" style="font-family:var(--mono)">
      <input id="editText" autocomplete="off">
    </div>
    <div class="bar">
      <button value="up" id="editUp" type="submit">↑ 上へ</button>
      <button value="down" id="editDown" type="submit">↓ 下へ</button>
      <span class="grow"></span>
      <button value="delete" class="textbtn danger" type="submit">削除</button>
      <button value="cancel" class="textbtn" type="submit">閉じる</button>
      <button value="save" class="primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

// ── 共有バックエンド（学習アプリと同じ Cloudflare Worker） ──
const API_BASE = "https://study-rotation-api.haizarakumin.workers.dev";
// 合言葉トークン（Worker の Secret APP_TOKEN と同じ値）。公開ソースに載るので本物の認証ではない
const APP_TOKEN = "sr_ycjC6D7Itb1UdJGbIXGXBGUn61ZXL4kG";

// ── localStorage キー ──
const K = {
  code:    "studyNotes.syncCode",  // 学習アプリとの連携コード
  state:   "studyNotes.state",     // 最後に受け取った「今日の状態」
  pulled:  "studyNotes.pulledAt",  // 最後に受け取った日時
  seen:    "studyNotes.seenAt",    // 自動で今日の動画に切り替えた状態の updatedAt
  cache:   "studyNotes.cache",     // { subjectId: {videos:[{id,title}], fetchedAt} }
  current: "studyNotes.current",   // { subjectId, no } 今開いている動画
  lastNo:  "studyNotes.lastNo",    // { subjectId: no } 手動選択で科目ごとに覚えておく本数
  kind:    "studyNotes.kind",      // 最後に使った入力の種類
  entries: "studyNotes.entries",   // メモ本体
};
const KIND = {
  shortcut: { label: "キー操作", ph: "" },
  step:     { label: "手順",     ph: "手順を1行で（例 長方形ツールで背景を描く）" },
  value:    { label: "設定値",   ph: "項目と値（例 ぼかし 12px）" },
};
// 連携前に使う科目（学習アプリの初期値と同じid）
const DEFAULT_SUBJECTS = [
  { id: "illustrator",  name: "Illustrator",   color: "#ff7a00", type: "channel",  url: "https://www.youtube.com/@irare" },
  { id: "photoshop",    name: "Photoshop",     color: "#31a8ff", type: "playlist", url: "" },
  { id: "aftereffects", name: "After Effects", color: "#9a7bff", type: "playlist", url: "" },
];

// ── 読み書き ──
function loadJSON(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; } }
function saveJSON(key, obj) { localStorage.setItem(key, JSON.stringify(obj)); }
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function hm(t) { return new Date(t).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
function loadState() { return loadJSON(K.state, null); }
function loadEntries() { return loadJSON(K.entries, []); }
function saveEntries(a) { saveJSON(K.entries, a); }
function loadCache() { return loadJSON(K.cache, {}); }
function subjects() { const st = loadState(); return st && st.subjects && st.subjects.length ? st.subjects : DEFAULT_SUBJECTS; }
function subjectById(id) { return subjects().find(s => s.id === id) || { id, name: id, color: "#999999", type: "playlist", url: "" }; }
function normCode(c) { return String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
function prettyCode(c) { return c.replace(/(.{4})(?=.)/g, "$1-"); }
function swatch(s) { return `<i class="swatch" style="--c:${s.color}"></i>`; }

// ── YouTube Data API（学習アプリの index.html と同じ取得方法。番号の数え方を揃えるため） ──
async function ytJson(path) {
  const res = await fetch(`${API_BASE}/yt?path=${encodeURIComponent(path)}`, { headers: { "X-App-Token": APP_TOKEN } });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || "YouTube API でエラーが出ました。");
  return data;
}
function extractListId(url) {
  if (!url) return "";
  const m = String(url).match(/[?&]list=([^&]+)/);
  if (m) return m[1];
  return /^[\w-]+$/.test(String(url).trim()) ? String(url).trim() : "";
}
async function uploadsFromChannelId(id) {
  const data = await ytJson(`channels?part=contentDetails&id=${id}`);
  if (!data.items || !data.items[0]) throw new Error("チャンネルIDからチャンネルを取得できませんでした。");
  return data.items[0].contentDetails.relatedPlaylists.uploads;
}
async function resolveUploadsPlaylist(url) {
  const u = String(url).trim();
  let m = u.match(/channel\/(UC[\w-]+)/) || u.match(/^(UC[\w-]+)$/);
  if (m) return await uploadsFromChannelId(m[1]);
  m = u.match(/@([\w.\-]+)/);
  if (m) { const data = await ytJson(`channels?part=contentDetails&forHandle=${encodeURIComponent(m[1])}`); if (data.items && data.items[0]) return data.items[0].contentDetails.relatedPlaylists.uploads; }
  m = u.match(/user\/([\w.\-]+)/);
  if (m) { const data = await ytJson(`channels?part=contentDetails&forUsername=${encodeURIComponent(m[1])}`); if (data.items && data.items[0]) return data.items[0].contentDetails.relatedPlaylists.uploads; }
  throw new Error("チャンネルを特定できませんでした。");
}
async function fetchVideos(id) {
  const s = subjectById(id);
  if (!s.url) throw new Error("URLが未設定です。");
  let listId;
  if (s.type === "channel") listId = await resolveUploadsPlaylist(s.url);
  else { listId = extractListId(s.url); if (!listId) throw new Error("再生リストのURLから list= が読み取れませんでした。"); }
  let videos = [], pageToken = "";
  do {
    const data = await ytJson(`playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${listId}${pageToken ? "&pageToken=" + pageToken : ""}`);
    for (const it of data.items) videos.push({ id: it.contentDetails.videoId, title: it.snippet.title });
    pageToken = data.nextPageToken || "";
  } while (pageToken);
  if (s.type === "channel") videos.reverse(); // チャンネルだけ古い順。再生リストは並び順そのまま
  const cache = loadCache();
  cache[id] = { videos, fetchedAt: Date.now() };
  saveJSON(K.cache, cache);
}

// ── 今開いている動画 ──
function getCurrent() {
  const cur = loadJSON(K.current, null);
  if (cur && cur.subjectId) return cur;
  const st = loadState();
  if (st && st.study) return { subjectId: st.study.subjectId, no: st.study.no || 1 };
  return { subjectId: subjects()[0].id, no: 1 };
}
function setCurrent(subjectId, no) {
  no = Math.max(1, no | 0);
  saveJSON(K.current, { subjectId, no });
  const ln = loadJSON(K.lastNo, {}); ln[subjectId] = no; saveJSON(K.lastNo, ln);
}
// タイトルは「今日の状態」→ 動画一覧 → 過去のメモ の順に探す
function videoInfo(subjectId, no) {
  const st = loadState();
  for (const r of [st && st.review, st && st.study]) {
    if (r && r.subjectId === subjectId && r.no === no && r.title) return { videoId: r.videoId, title: r.title };
  }
  const c = loadCache()[subjectId];
  if (c && c.videos && c.videos[no - 1]) return { videoId: c.videos[no - 1].id, title: c.videos[no - 1].title };
  const e = loadEntries().find(x => x.subjectId === subjectId && x.videoNo === no && x.title);
  return e ? { videoId: e.videoId || "", title: e.title } : { videoId: "", title: "" };
}
const fetching = {};
function ensureTitles(subjectId) {
  const s = subjectById(subjectId);
  if (!s.url || loadCache()[subjectId] || fetching[subjectId]) return;
  fetching[subjectId] = true;
  fetchVideos(subjectId).then(renderRecord).catch(() => {}).finally(() => { fetching[subjectId] = false; });
}

// ── 連携（学習アプリから今日の状態を受け取る） ──
function isTyping() {
  const ids = ["inKeys", "inDesc", "inText"];
  return ids.some(id => { const el = document.getElementById(id); return el.value.trim() || document.activeElement === el; });
}
async function pullState() {
  const code = localStorage.getItem(K.code);
  if (!code) { renderBadge(); return; }
  try {
    const res = await fetch(`${API_BASE}/sync/state`, { headers: { "X-App-Token": APP_TOKEN, "X-Sync-Code": code } });
    const data = await res.json().catch(() => ({}));
    if (res.status === 404) { setSyncInfo("PCの学習アプリからまだ送られていません。学習アプリを一度開いてください。"); return; }
    if (!res.ok) throw new Error((data.error && data.error.message) || res.status);
    saveJSON(K.state, data);
    localStorage.setItem(K.pulled, String(Date.now()));
    // 新しい「今日」が来たら学習動画を開く（書いている途中は切り替えない）
    const seen = Number(localStorage.getItem(K.seen) || 0);
    if (data.updatedAt > seen && data.study && !isTyping()) {
      setCurrent(data.study.subjectId, data.study.no || 1);
      localStorage.setItem(K.seen, String(data.updatedAt));
    }
    setSyncInfo("");
  } catch (e) {
    setSyncInfo("受け取れませんでした（" + e.message + "）。前回の内容で表示しています。");
  }
  renderAll();
}
let syncNote = "";
function setSyncInfo(t) { syncNote = t; renderSettings(); }
function renderBadge() {
  document.getElementById("syncBadge").textContent = localStorage.getItem(K.code) ? "学習アプリと連携中" : "未連携";
}

// ── 記録タブ ──
let kind = localStorage.getItem(K.kind) || "step";
function renderRecord() {
  const st = loadState(), cur = getCurrent();
  // 今日の動画：学習（主役）→ 復習
  const today = document.getElementById("todayCards");
  if (st && st.study) {
    today.hidden = false;
    today.innerHTML = [["study", "学習"], ["review", "復習"]].map(([role, label]) => {
      const r = st[role], s = subjectById(r.subjectId);
      if (!r.no) return `<li><button disabled><span class="role">${label}</span><span class="sub">${swatch(s)}${escapeHtml(s.name)}</span><span></span><span class="t">まだありません</span></button></li>`;
      const on = cur.subjectId === r.subjectId && cur.no === r.no;
      return `<li><button class="${on ? "on" : ""}" data-sid="${r.subjectId}" data-no="${r.no}">` +
        `<span class="role">${label}</span><span class="sub">${swatch(s)}${escapeHtml(s.name)}</span><span class="no num">${r.no}本目</span>` +
        `<span class="t clamp2">${escapeHtml(r.title || "")}</span></button></li>`;
    }).join("");
  } else {
    today.hidden = true;
  }
  // ほかの動画を選ぶ
  const sel = document.getElementById("pickSubject");
  sel.innerHTML = subjects().map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
  sel.value = cur.subjectId;
  document.getElementById("pickNo").textContent = `${cur.no}本目`;
  // いま書いている動画
  const s = subjectById(cur.subjectId), info = videoInfo(cur.subjectId, cur.no);
  document.getElementById("curVideo").innerHTML =
    `${swatch(s)}<b>${escapeHtml(s.name)} <span class="num">${cur.no}本目</span></b>` +
    `<span class="clamp1">${escapeHtml(info.title || (s.url ? "タイトルを読み込み中" : ""))}</span>`;
  if (!info.title) ensureTitles(cur.subjectId);
  renderComposer();
  renderEntries();
}
function renderComposer() {
  document.querySelectorAll("#kinds button").forEach(b => { b.classList.toggle("on", b.dataset.kind === kind); b.setAttribute("aria-selected", b.dataset.kind === kind); });
  document.getElementById("rowShortcut").hidden = kind !== "shortcut";
  document.getElementById("rowText").hidden = kind === "shortcut";
  document.getElementById("inText").placeholder = KIND[kind].ph;
}
function currentEntries() {
  const cur = getCurrent();
  return loadEntries().filter(e => e.subjectId === cur.subjectId && e.videoNo === cur.no).sort((a, b) => a.createdAt - b.createdAt);
}
function entryHTML(e) {
  if (e.kind === "shortcut") return `<button class="entry" data-edit="${e.id}">${e.keys ? `<kbd>${escapeHtml(e.keys)}</kbd>` : ""}<span>${escapeHtml(e.text)}</span></button>`;
  return `<button class="entry" data-edit="${e.id}"><span>${escapeHtml(e.text)}</span></button>`;
}
function renderEntries() {
  const list = currentEntries(), box = document.getElementById("entries");
  if (!list.length) { box.innerHTML = `<p class="empty">この動画のメモはまだありません。上の欄に打って Enter で追加できます。</p>`; return; }
  box.innerHTML = ["shortcut", "step", "value"].map(k => {
    const items = list.filter(e => e.kind === k);
    if (!items.length) return "";
    return `<div class="group">${items.map(entryHTML).join("")}</div>`;
  }).join("");
}
function addFromComposer() {
  const cur = getCurrent(), info = videoInfo(cur.subjectId, cur.no);
  const keysEl = document.getElementById("inKeys"), descEl = document.getElementById("inDesc"), textEl = document.getElementById("inText");
  let keys = "", text;
  if (kind === "shortcut") {
    keys = keysEl.value.trim().replace(/[a-z]/g, c => c.toUpperCase());
    text = descEl.value.trim();
    if (!keys && !text) return;
  } else {
    text = textEl.value.trim();
    if (!text) return;
  }
  const entries = loadEntries();
  entries.push({ id: "n" + Date.now() + Math.random().toString(36).slice(2, 6), subjectId: cur.subjectId, videoNo: cur.no,
    videoId: info.videoId, title: info.title, kind, keys, text, createdAt: Date.now(), quiz: { ok: 0, ng: 0, due: 0 } });
  saveEntries(entries);
  if (kind === "shortcut") { keysEl.value = ""; descEl.value = ""; keysEl.focus(); }
  else { textEl.value = ""; textEl.focus(); }
  renderEntries();
}

// ── 見返すタブ ──
let reviewFilter = "all";
function filterSelect(selId, value) {
  const sel = document.getElementById(selId);
  sel.innerHTML = `<option value="all">すべての科目</option>` + subjects().map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
  sel.value = subjects().some(s => s.id === value) ? value : "all";
}
function highlight(text, q) {
  const t = escapeHtml(text);
  if (!q) return t;
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return t;
  return escapeHtml(text.slice(0, i)) + "<mark>" + escapeHtml(text.slice(i, i + q.length)) + "</mark>" + escapeHtml(text.slice(i + q.length));
}
function renderReview() {
  filterSelect("reviewFilter", reviewFilter);
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  let list = loadEntries().filter(e => reviewFilter === "all" || e.subjectId === reviewFilter);
  if (q) list = list.filter(e => [e.keys, e.text, e.title, subjectById(e.subjectId).name].join(" ").toLowerCase().includes(q));
  // 動画ごとにまとめ、新しく書いた順に並べる
  const groups = new Map();
  list.forEach(e => { const k = e.subjectId + "#" + e.videoNo; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  const sorted = [...groups.values()].sort((a, b) => Math.max(...b.map(e => e.createdAt)) - Math.max(...a.map(e => e.createdAt)));
  const box = document.getElementById("reviewList");
  if (!sorted.length) { box.innerHTML = `<p class="empty">${q ? "見つかりませんでした。" : "まだメモがありません。記録タブで書いたメモがここに並びます。"}</p>`; return; }
  box.innerHTML = sorted.map(items => {
    items.sort((a, b) => a.createdAt - b.createdAt);
    const e0 = items[0], s = subjectById(e0.subjectId), info = videoInfo(e0.subjectId, e0.videoNo);
    let stepNo = 0;
    const lines = items.slice(0, q ? 50 : 4).map(e => {
      if (e.kind === "shortcut") return `<div class="line">${e.keys ? `<kbd>${highlight(e.keys, q)}</kbd>` : ""}${highlight(e.text, q)}</div>`;
      if (e.kind === "step") { stepNo++; return `<div class="line"><span class="n">${stepNo}.</span>${highlight(e.text, q)}</div>`; }
      return `<div class="line">${highlight(e.text, q)}</div>`;
    }).join("");
    const more = !q && items.length > 4 ? `<div class="note">ほか <span class="num">${items.length - 4}</span> 件</div>` : "";
    return `<button class="vgroup" data-open="${e0.subjectId}" data-no="${e0.videoNo}">` +
      `<div class="head">${swatch(s)}<b>${escapeHtml(s.name)} <span class="num">${e0.videoNo}本目</span></b><span class="clamp1">${escapeHtml(info.title || "")}</span></div>` +
      lines + more + `</button>`;
  }).join("");
}

// ── クイズタブ（キー操作） ──
let quizFilter = "all", quizId = null, quizShown = false, quizAll = false;
const DAY = 86400000, INTERVALS = [1, 3, 7, 14, 30]; // 覚えた回数ごとの次の出題までの日数
function quizPool() {
  return loadEntries().filter(e => e.kind === "shortcut" && e.keys && e.text && (quizFilter === "all" || e.subjectId === quizFilter));
}
function pickQuiz(excludeId) {
  const now = Date.now(), pool = quizPool();
  let list = pool.filter(e => !(e.quiz && e.quiz.due > now));
  if (!list.length && quizAll) list = pool;
  list.sort((a, b) => ((a.quiz && a.quiz.due) || 0) - ((b.quiz && b.quiz.due) || 0));
  const pick = list.find(e => e.id !== excludeId) || list[0];
  return pick ? pick.id : null;
}
function renderQuiz() {
  filterSelect("quizFilter", quizFilter);
  const box = document.getElementById("quizBox"), pool = quizPool(), now = Date.now();
  if (!pool.length) { box.innerHTML = `<p class="empty">キー操作のメモがまだありません。記録タブの「キー操作」で追加すると、ここで覚えられます。</p>`; return; }
  if (!quizId || !pool.some(e => e.id === quizId)) { quizId = pickQuiz(); quizShown = false; }
  const left = pool.filter(e => !(e.quiz && e.quiz.due > now)).length;
  if (!quizId) {
    const next = Math.min(...pool.map(e => (e.quiz && e.quiz.due) || 0));
    box.innerHTML = `<div class="quiz"><div class="q">今日の分は終わりました</div><p class="note">次の出題は ${hm(next)}</p>` +
      `<div class="btns" style="margin-top:20px;"><button id="quizAllBtn">全部もう一度やる</button></div></div>`;
    return;
  }
  const e = pool.find(x => x.id === quizId), s = subjectById(e.subjectId);
  box.innerHTML = `<div class="quiz">` +
    `<div class="meta">${swatch(s)}<span>${escapeHtml(s.name)} <span class="num">${e.videoNo}本目</span></span><span>残り <span class="num">${left}</span> / <span class="num">${pool.length}</span></span></div>` +
    `<div class="q">${escapeHtml(e.text)}</div>` +
    (quizShown
      ? `<div class="a"><kbd>${escapeHtml(e.keys)}</kbd></div><div class="btns"><button id="quizNg">まだ覚えていない</button><button id="quizOk" class="primary">覚えた</button></div>`
      : `<div class="btns"><button id="quizShow" class="primary">キーを見る</button></div>`) +
    `</div>`;
}
function answerQuiz(ok) {
  const entries = loadEntries(), e = entries.find(x => x.id === quizId); if (!e) return;
  e.quiz = e.quiz || { ok: 0, ng: 0, due: 0 };
  if (ok) { e.quiz.ok++; e.quiz.due = Date.now() + INTERVALS[Math.min(e.quiz.ok - 1, INTERVALS.length - 1)] * DAY; }
  else { e.quiz.ng++; e.quiz.ok = 0; e.quiz.due = Date.now() + 60000; } // 「まだ」は1分後（他のカードの後）にもう一度
  saveEntries(entries);
  const prev = quizId; quizId = pickQuiz(prev); quizShown = false;
  renderQuiz();
}

// ── 設定タブ ──
function renderSettings() {
  const code = localStorage.getItem(K.code), pulled = Number(localStorage.getItem(K.pulled) || 0);
  document.getElementById("syncInfo").textContent = code
    ? `連携中（コード ${prettyCode(code)}）。最後に受け取った日時：${pulled ? hm(pulled) : "まだ"}` + (syncNote ? `　${syncNote}` : "")
    : "まだ連携していません。PCの学習アプリのQRを読むか、コードを入れてください。";
  const n = loadEntries().length;
  document.getElementById("countInfo").textContent = `メモは全部で ${n} 件。このスマホの中だけに保存されているので、ときどき書き出しておくと安心です。`;
  renderBadge();
}

// ── 全体 ──
let tab = "record";
function renderAll() {
  if (tab === "record") renderRecord();
  else if (tab === "review") renderReview();
  else if (tab === "quiz") renderQuiz();
  renderSettings();
}
function switchTab(t) {
  tab = t;
  ["record", "review", "quiz", "settings"].forEach(x => { document.getElementById("tab-" + x).hidden = x !== t; });
  document.querySelectorAll("#tabbar button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  window.scrollTo(0, 0);
  renderAll();
}

// ── 操作 ──
document.getElementById("tabbar").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) switchTab(b.dataset.tab); });
document.getElementById("todayCards").addEventListener("click", e => {
  const b = e.target.closest("button[data-sid]"); if (!b) return;
  setCurrent(b.dataset.sid, Number(b.dataset.no)); renderRecord();
});
document.getElementById("pickSubject").addEventListener("change", e => {
  const st = loadState(), sid = e.target.value, ln = loadJSON(K.lastNo, {});
  const today = st && [st.study, st.review].find(r => r && r.subjectId === sid && r.no);
  setCurrent(sid, today ? today.no : (ln[sid] || 1)); renderRecord();
});
document.getElementById("picker").addEventListener("click", e => {
  const step = e.target.closest("button[data-step]"); if (!step) return;
  const cur = getCurrent(); setCurrent(cur.subjectId, cur.no + Number(step.dataset.step)); renderRecord();
});
document.getElementById("kinds").addEventListener("click", e => {
  const b = e.target.closest("button[data-kind]"); if (!b) return;
  kind = b.dataset.kind; localStorage.setItem(K.kind, kind); renderComposer();
  document.getElementById(kind === "shortcut" ? "inKeys" : "inText").focus();
});
// 修飾キーボタン：押しても入力欄からフォーカスを外さない（キーボードを閉じない）
const mods = document.getElementById("mods");
mods.addEventListener("pointerdown", e => { if (e.target.closest("button")) e.preventDefault(); });
mods.addEventListener("click", e => {
  const b = e.target.closest("button[data-mod]"); if (!b) return;
  const el = document.getElementById("inKeys");
  el.value = b.dataset.mod === "BS" ? [...el.value].slice(0, -1).join("") : el.value + b.dataset.mod;
  el.focus();
});
document.querySelectorAll("[data-add]").forEach(b => {
  b.addEventListener("pointerdown", e => e.preventDefault());
  b.addEventListener("click", addFromComposer);
});
// Enter で追加（日本語変換の確定 Enter では追加しない）
function onEnter(el, fn) { el.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); fn(); } }); }
onEnter(document.getElementById("inKeys"), () => document.getElementById("inDesc").focus());
onEnter(document.getElementById("inDesc"), addFromComposer);
onEnter(document.getElementById("inText"), addFromComposer);
// 入力中は下のタブを隠す（キーボードの上に浮かないように）
document.addEventListener("focusin", e => { if (e.target.matches("input")) document.body.classList.add("typing"); });
document.addEventListener("focusout", () => setTimeout(() => { if (!document.activeElement || !document.activeElement.matches("input")) document.body.classList.remove("typing"); }, 50));

// メモの編集
const dlg = document.getElementById("editDlg");
let editId = null;
document.getElementById("entries").addEventListener("click", e => {
  const b = e.target.closest("button[data-edit]"); if (!b) return;
  const en = loadEntries().find(x => x.id === b.dataset.edit); if (!en) return;
  editId = en.id;
  document.getElementById("editKind").textContent = `${KIND[en.kind].label}を編集`;
  const keysEl = document.getElementById("editKeys"), textEl = document.getElementById("editText");
  keysEl.hidden = en.kind !== "shortcut"; keysEl.value = en.keys || "";
  textEl.value = en.text || ""; textEl.placeholder = en.kind === "shortcut" ? "何をする操作か" : KIND[en.kind].ph;
  document.getElementById("editUp").hidden = document.getElementById("editDown").hidden = en.kind !== "step";
  dlg.showModal();
});
// ボタンを押した時点で処理してから閉じる（close イベント頼みにしない）
document.getElementById("editForm").addEventListener("click", e => {
  const b = e.target.closest("button[value]"); if (!b) return;
  e.preventDefault();
  applyEdit(b.value);
  dlg.close();
});
function applyEdit(act) {
  const entries = loadEntries(), i = entries.findIndex(x => x.id === editId);
  if (i < 0 || act === "cancel") return;
  const en = entries[i];
  if (act === "delete") {
    if (!confirm("このメモを削除しますか？")) return;
    entries.splice(i, 1);
  } else if (act === "save") {
    en.keys = document.getElementById("editKeys").value.trim().replace(/[a-z]/g, c => c.toUpperCase());
    en.text = document.getElementById("editText").value.trim();
  } else if (act === "up" || act === "down") {
    // 手順の並べ替え：隣と入れ替えた順に、作成日時を1ミリ秒ずつ振り直す（同じ日時でも確実に並ぶ）
    const steps = entries.filter(x => x.kind === "step" && x.subjectId === en.subjectId && x.videoNo === en.videoNo).sort((a, b) => a.createdAt - b.createdAt);
    const j = steps.indexOf(en), k = act === "up" ? j - 1 : j + 1;
    if (k >= 0 && k < steps.length) {
      const base = Math.min(...steps.map(x => x.createdAt));
      [steps[j], steps[k]] = [steps[k], steps[j]];
      steps.forEach((x, n) => { x.createdAt = base + n; });
    }
  }
  saveEntries(entries); renderEntries();
}

// 見返す
document.getElementById("searchInput").addEventListener("input", renderReview);
document.getElementById("reviewFilter").addEventListener("change", e => { reviewFilter = e.target.value; renderReview(); });
document.getElementById("reviewList").addEventListener("click", e => {
  const b = e.target.closest("button[data-open]"); if (!b) return;
  setCurrent(b.dataset.open, Number(b.dataset.no)); switchTab("record");
});

// クイズ
document.getElementById("quizFilter").addEventListener("change", e => { quizFilter = e.target.value; quizId = null; renderQuiz(); });
document.getElementById("quizBox").addEventListener("click", e => {
  if (e.target.id === "quizShow") { quizShown = true; renderQuiz(); }
  else if (e.target.id === "quizOk") answerQuiz(true);
  else if (e.target.id === "quizNg") answerQuiz(false);
  else if (e.target.id === "quizAllBtn") { quizAll = true; quizId = null; renderQuiz(); }
});

// 設定
document.getElementById("codeSaveBtn").addEventListener("click", () => {
  const c = normCode(document.getElementById("codeInput").value);
  if (c.length < 16) { alert("コードは16文字です（ハイフンは無くてもOK）。"); return; }
  localStorage.setItem(K.code, c); localStorage.removeItem(K.seen);
  document.getElementById("codeInput").value = ""; pullState();
});
document.getElementById("pullBtn").addEventListener("click", () => { localStorage.removeItem(K.seen); pullState(); });
document.getElementById("unlinkBtn").addEventListener("click", () => {
  if (!confirm("連携を解除しますか？（メモは消えません）")) return;
  [K.code, K.state, K.pulled, K.seen].forEach(k => localStorage.removeItem(k));
  history.replaceState(null, "", location.pathname);
  renderAll();
});
document.getElementById("exportBtn").addEventListener("click", () => {
  const data = {};
  Object.values(K).forEach(k => { const v = localStorage.getItem(k); if (v !== null) data[k] = v; });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = `学習メモ_バックアップ_${ymd(new Date())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      Object.keys(data).forEach(k => { if (k.startsWith("studyNotes.")) localStorage.setItem(k, data[k]); });
      alert("読み込みました。"); location.reload();
    } catch (err) { alert("読み込めませんでした：" + err.message); }
  };
  reader.readAsText(file);
});

// アプリに戻ってきたら今日の状態を取り直す
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pullState(); });

// ── 初期化 ──
// QRのリンク（…/notes.html#sync=コード）から開いたらコードを保存。
// ホーム画面に追加したときにコードが引き継がれるよう、URLの #sync はあえて残す
(function readHash() {
  const m = location.hash.match(/sync=([A-Za-z0-9-]+)/);
  if (!m) return;
  const c = normCode(m[1]);
  if (c.length >= 16 && c !== localStorage.getItem(K.code)) { localStorage.setItem(K.code, c); localStorage.removeItem(K.seen); }
})();
renderComposer();
renderAll();
pullState();
</script>
